<svg xmlns="http://www.w3.org/2000/svg" width="963" height="1173" viewBox="0 0 963 1173" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5">
  <rect width="100%" height="100%" fill="#10131a" rx="10"/>
  <text x="26" y="59.4" xml:space="preserve"><tspan fill="#d7dae0" font-weight="600">toolInterfacer</tspan><tspan fill="#d7dae0" opacity="0.55">  ·  one intent in, one answer out, plus the receipt</tspan></text>
  <text x="26" y="78.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">──────────────────────────────────────────────────────────────────────────────</tspan></text>
  <text x="26" y="97.4" xml:space="preserve"><tspan fill="#d7dae0">  service   http://127.0.0.1:44779   (9 ops registered)</tspan></text>
  <text x="26" y="116.4" xml:space="preserve"><tspan fill="#d7dae0">  deciding  </tspan><tspan fill="#56b6c2">fixture</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">(recorded answers — deterministic, offline)</tspan></text>
  <text x="26" y="135.4" xml:space="preserve"><tspan fill="#d7dae0">  tools     </tspan><tspan fill="#d7dae0" opacity="0.55">the repo fixtures (tests/data/fake_cli.py) — deterministic</tspan></text>
  <text x="26" y="154.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">  files     /tmp/ti-demo-files-5krlfugp</tspan></text>
  <text x="26" y="173.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">──────────────────────────────────────────────────────────────────────────────</tspan></text>
  <text x="26" y="192.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">  note: scene 3's picks are recorded answers, not a model's. Run with</tspan></text>
  <text x="26" y="211.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">        --live to see the configured backend actually decide.</tspan></text>
  <text x="26" y="249.4" xml:space="preserve"><tspan fill="#d7dae0" font-weight="600">scene 1 — the caller names the operation</tspan></text>
  <text x="26" y="268.4" xml:space="preserve"><tspan fill="#d7dae0">  intent  </tspan><tspan fill="#56b6c2">'read notes.md'</tspan></text>
  <text x="26" y="287.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">          L0 passthrough — no decision is made, so there is nothing to reason about</tspan></text>
  <text x="26" y="325.4" xml:space="preserve"><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">step            op                       ms   conf  artifact</tspan></text>
  <text x="26" y="344.4" xml:space="preserve"><tspan fill="#d7dae0">  L0              filesys_read            0.1</tspan><tspan fill="#98c379">   1.00</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55"># Project notes The decision model</tspan></text>
  <text x="26" y="382.4" xml:space="preserve"><tspan fill="#d7dae0">  status </tspan><tspan fill="#98c379">done</tspan><tspan fill="#d7dae0">   confidence absent (nothing was measured)   </tspan><tspan fill="#d7dae0" font-weight="600">1</tspan><tspan fill="#d7dae0"> hops in 26 ms wall</tspan></text>
  <text x="26" y="401.4" xml:space="preserve"><tspan fill="#d7dae0">  result # Project notes The decision model runs one forward pass.</tspan></text>
  <text x="26" y="439.4" xml:space="preserve"><tspan fill="#d7dae0" font-weight="600">scene 2 — a vague intent, resolved against real files</tspan></text>
  <text x="26" y="458.4" xml:space="preserve"><tspan fill="#d7dae0">  intent  </tspan><tspan fill="#56b6c2">'read the notes file'</tspan></text>
  <text x="26" y="477.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">          L1 slot fill — the service globs the directory, picks, then reads</tspan></text>
  <text x="26" y="515.4" xml:space="preserve"><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">step            op                       ms   conf  artifact</tspan></text>
  <text x="26" y="534.4" xml:space="preserve"><tspan fill="#d7dae0">  candidates      filesys_glob            2.3</tspan><tspan fill="#98c379">   1.00</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">path_list[3] e.g. server-out.log</tspan></text>
  <text x="26" y="553.4" xml:space="preserve"><tspan fill="#d7dae0">  picked_file     decide_pick             9.3</tspan><tspan fill="#98c379">   0.93</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">picked_items[1] e.g. notes.md</tspan></text>
  <text x="26" y="572.4" xml:space="preserve"><tspan fill="#d7dae0">  content         filesys_read            0.1</tspan><tspan fill="#98c379">   1.00</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">file_content :: # Project notes Th</tspan></text>
  <text x="26" y="610.4" xml:space="preserve"><tspan fill="#d7dae0">  status </tspan><tspan fill="#98c379">done</tspan><tspan fill="#d7dae0">   confidence 0.93   </tspan><tspan fill="#d7dae0" font-weight="600">3</tspan><tspan fill="#d7dae0"> hops in 22 ms wall</tspan></text>
  <text x="26" y="629.4" xml:space="preserve"><tspan fill="#d7dae0">  result # Project notes The decision model runs one forward pass.</tspan></text>
  <text x="26" y="667.4" xml:space="preserve"><tspan fill="#d7dae0" font-weight="600">scene 3 — a compound intent</tspan></text>
  <text x="26" y="686.4" xml:space="preserve"><tspan fill="#d7dae0">  intent  </tspan><tspan fill="#56b6c2">'research lora rank for a 3b router'</tspan></text>
  <text x="26" y="705.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">          L2 template — extract queries, search, pick, fetch (gated), digest</tspan></text>
  <text x="26" y="743.4" xml:space="preserve"><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">step            op                       ms   conf  artifact</tspan></text>
  <text x="26" y="762.4" xml:space="preserve"><tspan fill="#d7dae0">  queries         decide_extract          0.5</tspan><tspan fill="#d7dae0" opacity="0.55">      —</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">value_list[6] e.g. research lora r</tspan></text>
  <text x="26" y="781.4" xml:space="preserve"><tspan fill="#d7dae0">  hits            web_search            148.2</tspan><tspan fill="#98c379">   1.00</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">url_list[7] e.g. {'title': 'A frag</tspan></text>
  <text x="26" y="800.4" xml:space="preserve"><tspan fill="#d7dae0">  picked          decide_pick             0.3</tspan><tspan fill="#98c379">   0.93</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">picked_items[4] e.g. https://examp</tspan></text>
  <text x="26" y="819.4" xml:space="preserve"><tspan fill="#d7dae0">  pages#0         web_fetch              23.4</tspan><tspan fill="#98c379">   1.00</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">pages[1] e.g. {'url': 'https://exa</tspan></text>
  <text x="26" y="838.4" xml:space="preserve"><tspan fill="#d7dae0">  pages#1         web_fetch              22.1</tspan><tspan fill="#98c379">   1.00</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">pages[1] e.g. {'url': 'https://oth</tspan></text>
  <text x="26" y="857.4" xml:space="preserve"><tspan fill="#d7dae0">  pages#2         web_fetch              25.9</tspan><tspan fill="#98c379">   1.00</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">pages[1] e.g. {'url': 'https://oth</tspan></text>
  <text x="26" y="876.4" xml:space="preserve"><tspan fill="#d7dae0">  pages#3         web_fetch              24.5</tspan><tspan fill="#98c379">   1.00</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">pages[1] e.g. {'url': 'https://oth</tspan></text>
  <text x="26" y="895.4" xml:space="preserve"><tspan fill="#d7dae0">  digest          digest_assemble         0.2</tspan><tspan fill="#98c379">   1.00</tspan><tspan fill="#d7dae0">  </tspan><tspan fill="#d7dae0" opacity="0.55">digest :: {'intent': 'research lor</tspan></text>
  <text x="26" y="933.4" xml:space="preserve"><tspan fill="#d7dae0">  status </tspan><tspan fill="#98c379">done</tspan><tspan fill="#d7dae0">   confidence 0.93   </tspan><tspan fill="#d7dae0" font-weight="600">8</tspan><tspan fill="#d7dae0"> hops in 251 ms wall</tspan></text>
  <text x="26" y="952.4" xml:space="preserve"><tspan fill="#d7dae0">  result 4 source(s) · queries: research lora rank, research lora, research · first: https://example.test/a#frag</tspan></text>
  <text x="26" y="990.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">──────────────────────────────────────────────────────────────────────────────</tspan></text>
  <text x="26" y="1009.4" xml:space="preserve"><tspan fill="#d7dae0" font-weight="600">  the whole point: </tspan><tspan fill="#d7dae0">the model made one call per scene, and got every hop above as evidence.</tspan></text>
  <text x="26" y="1028.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">  A normal agent makes one model round trip per tool call. Here the number</tspan></text>
  <text x="26" y="1047.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">  of hops and the number of round trips are decoupled — which helps when a</tspan></text>
  <text x="26" y="1066.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">  round trip is expensive and hurts when the local decision is. Measured:</tspan></text>
  <text x="26" y="1085.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">  docs/roundtrips-2026-11-03.md.</tspan></text>
  <text x="26" y="1104.4" xml:space="preserve"><tspan fill="#d7dae0" opacity="0.55">──────────────────────────────────────────────────────────────────────────────</tspan></text>
</svg>
