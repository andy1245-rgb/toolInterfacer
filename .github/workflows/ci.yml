name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -q

  typecheck:
    name: extension typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        working-directory: pi-extension
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: pi-extension
        run: npx tsc --noEmit

  contract-check:
    name: extension checks (contract + capture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        working-directory: pi-extension
        run: npm ci --no-audit --no-fund
      # --live binds a stub service on an ephemeral loopback port and drives it through
      # bridge.call(), so the run needs no external service and no fixed port.
      - name: Contract check against the stubbed service
        working-directory: pi-extension
        run: node scripts/contract-check.ts --live
      - name: Capture check
        working-directory: pi-extension
        run: node scripts/capture-check.ts

  package:
    name: wheel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: The wheel carries every subpackage
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "ti/http/api.py",
              "ti/decide/resolve.py",
              "ti/ops/op_api.py",
              "ti/conf/defaults.json",
          ]
          missing = [r for r in required if r not in names]
          assert not missing, f"{wheel} is missing {missing}"
          print(f"{wheel}: {len(names)} files, required modules present")
          PY
